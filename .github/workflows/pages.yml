name: Publicar site no Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Gerar paginas
        run: python -X utf8 build.py

      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no Pages
        id: deployment
        uses: actions/deploy-pages@v4
