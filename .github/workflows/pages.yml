name: Publicar site no Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 03:00 UTC = meia-noite em Fortaleza (UTC-3).
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Testar sincronizacao
        run: python -X utf8 -m unittest discover -s tests -v

      - name: Consultar listas do SIGAA
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python -X utf8 sync_sigaa.py

      - name: Gerar paginas
        run: python -X utf8 build.py

      - name: Salvar resultado da checagem no repositorio
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.tsv sync-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza checagem das listas do SIGAA"
            git push origin HEAD:main
          fi

      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no Pages
        id: deployment
        uses: actions/deploy-pages@v4
